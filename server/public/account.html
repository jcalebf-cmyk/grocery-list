<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Groceries</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Opened from the confirmation and password reset emails (and Firebase's own, for older app versions).
  The link carries Firebase's one-time code; this page finishes the job with Firebase's REST API.
-->
<style>
  :root {
    --bg: #FBF8F2; --card: #FFFFFF; --line: #EBE6DC; --ink: #1C1B17; --body: #4A473F; --muted: #7A766C;
    --green: #1F6B3A; --on-green: #FFFFFF; --green-soft: #C9F0D3; --on-green-soft: #002110;
    --amber-soft: #FFDDAF; --on-amber-soft: #2C1700; --field: #F6F2EA; --error: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130F; --card: #1F1E1A; --line: #33312B; --ink: #EDE8DD; --body: #CFC9BC; --muted: #9C968A;
      --green: #8FD8A5; --on-green: #00391C; --green-soft: #0C5128; --on-green-soft: #ABF5C0;
      --amber-soft: #6A3C00; --on-amber-soft: #FFDDAF; --field: #2A2924; --error: #F2B8B5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--body);
    font: 16px/1.5 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 48px 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; color: var(--ink); font-weight: 700; font-size: 20px; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 36px 32px 32px; }
  @media (max-width: 480px) { body { padding-top: 32px; } .card { padding: 28px 22px 24px; } }
  .badge { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 20px; }
  .badge.ok { background: var(--green-soft); color: var(--on-green-soft); }
  .badge.warn { background: var(--amber-soft); color: var(--on-amber-soft); }
  .badge svg { width: 28px; height: 28px; }
  h1 { margin: 0 0 8px; color: var(--ink); font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.3px; }
  p { margin: 0 0 12px; }
  .email { color: var(--ink); font-weight: 600; word-break: break-all; }
  label { display: block; margin: 20px 0 6px; color: var(--ink); font-size: 14px; font-weight: 600; }
  .field { position: relative; }
  input {
    width: 100%; padding: 14px 64px 14px 16px; border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--field); color: var(--ink); font: inherit;
  }
  input:focus { outline: none; border-color: var(--green); }
  .show {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none;
    color: var(--green); font: inherit; font-size: 14px; font-weight: 600; padding: 8px 10px; cursor: pointer;
  }
  .hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .hint.error, .error { color: var(--error); }
  .primary {
    width: 100%; margin-top: 24px; padding: 15px 20px; border: 0; border-radius: 999px; background: var(--green);
    color: var(--on-green); font: inherit; font-weight: 600; cursor: pointer;
  }
  .primary:disabled { opacity: 0.5; cursor: default; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 8px 0 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="brand"><img src="/icon.png" alt="">Groceries</div>
  <main class="card" id="card" aria-live="polite">
    <div class="spinner" role="status" aria-label="Loading"></div>
    <p>One moment…</p>
  </main>
  <footer>The shared grocery list for your household</footer>

  <template id="reset-form">
    <h1>Choose a new password</h1>
    <p>For <span class="email" data-email></span></p>
    <form novalidate>
      <label for="password">New password</label>
      <div class="field">
        <input id="password" type="password" autocomplete="new-password" required>
        <button type="button" class="show" aria-controls="password">Show</button>
      </div>
      <p class="hint" id="password-hint">At least 6 characters</p>
      <label for="confirm">Type it again</label>
      <div class="field">
        <input id="confirm" type="password" autocomplete="new-password" required>
      </div>
      <p class="hint error" id="confirm-hint" hidden>The passwords don't match.</p>
      <p class="error" id="form-error" hidden></p>
      <button class="primary" type="submit">Save password</button>
    </form>
  </template>

  <script>
    const MIN_PASSWORD = 6; // same as the apps
    const params = new URLSearchParams(location.search);
    const mode = params.get("mode");
    const code = params.get("oobCode");
    const apiKey = params.get("apiKey");
    const card = document.getElementById("card");

    const icons = {
      ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
      warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 7v6"/><path d="M12 17h.01"/></svg>',
    };

    function show(kind, title, ...lines) {
      card.innerHTML = `<div class="badge ${kind}">${icons[kind]}</div><h1></h1>` + lines.map(() => "<p></p>").join("");
      card.querySelector("h1").textContent = title;
      card.querySelectorAll("p").forEach((p, i) => (p.textContent = lines[i]));
      document.title = `${title} · Groceries`;
    }

    // Firebase Auth REST API; errors come back as e.g. { error: { message: "EXPIRED_OOB_CODE" } }.
    async function firebase(method, body) {
      const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${method}?key=${encodeURIComponent(apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error?.message ?? `HTTP ${response.status}`);
      return data;
    }

    const isUsedOrExpired = (e) => /OOB_CODE|USER_NOT_FOUND|EMAIL_NOT_FOUND|USER_DISABLED/.test(e.message);

    function showNetworkError() {
      show("warn", "Couldn't reach Groceries", "Check your internet connection, then reload this page to try again.");
    }

    async function confirmEmail() {
      try {
        await firebase("update", { oobCode: code });
        show("ok", "Email confirmed", "Thanks! You're all set. You can go back to the Groceries app now.");
      } catch (e) {
        if (!isUsedOrExpired(e)) return showNetworkError();
        show("warn", "This link no longer works",
          "If you've already confirmed your email, you're all set.",
          "Otherwise, open Groceries, go to Settings, and tap Resend to get a new link.");
      }
    }

    function showResetExpired() {
      show("warn", "This link no longer works",
        "Reset links work once and only for a short time.",
        "To get a new one, open Groceries and tap “Forgot password?” on the sign-in screen.");
    }

    async function resetPassword() {
      let email;
      try {
        ({ email } = await firebase("resetPassword", { oobCode: code })); // checks the link without using it up
      } catch (e) {
        return isUsedOrExpired(e) ? showResetExpired() : showNetworkError();
      }

      card.replaceChildren(document.getElementById("reset-form").content.cloneNode(true));
      document.title = "Choose a new password · Groceries";
      card.querySelector("[data-email]").textContent = email;
      const form = card.querySelector("form");
      const password = form.querySelector("#password");
      const confirm = form.querySelector("#confirm");
      const passwordHint = form.querySelector("#password-hint");
      const confirmHint = form.querySelector("#confirm-hint");
      const formError = form.querySelector("#form-error");
      const save = form.querySelector(".primary");
      const toggle = form.querySelector(".show");
      let submitted = false;

      toggle.addEventListener("click", () => {
        const visible = password.type === "password";
        password.type = confirm.type = visible ? "text" : "password";
        toggle.textContent = visible ? "Hide" : "Show";
      });

      function validate() {
        const tooShort = password.value.length > 0 && password.value.length < MIN_PASSWORD;
        passwordHint.textContent = tooShort ? `Too short. Use at least ${MIN_PASSWORD} characters.` : `At least ${MIN_PASSWORD} characters`;
        passwordHint.classList.toggle("error", tooShort && submitted);
        // Only complain about a mismatch once they've typed as much as the first box, or tried to save.
        const mismatch = confirm.value !== password.value && (submitted || confirm.value.length >= password.value.length);
        confirmHint.hidden = !mismatch || confirm.value.length === 0;
        formError.hidden = true;
        return password.value.length >= MIN_PASSWORD && confirm.value === password.value;
      }
      password.addEventListener("input", validate);
      confirm.addEventListener("input", validate);
      password.focus();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitted = true;
        if (!validate()) return;
        save.disabled = true;
        save.textContent = "Saving…";
        try {
          await firebase("resetPassword", { oobCode: code, newPassword: password.value });
          show("ok", "Password updated", "You can now sign in to Groceries with your new password.");
        } catch (e) {
          if (isUsedOrExpired(e)) return showResetExpired();
          save.disabled = false;
          save.textContent = "Save password";
          formError.textContent = /WEAK_PASSWORD/.test(e.message)
            ? "That password is too easy to guess. Try a longer one."
            : "Couldn't save your password. Check your connection and try again.";
          formError.hidden = false;
        }
      });
    }

    if (!code || !apiKey) {
      show("warn", "This link isn't complete", "Try tapping the button in the email again. If you copied the link, make sure you copied all of it.");
    } else if (mode === "verifyEmail") {
      confirmEmail();
    } else if (mode === "resetPassword") {
      resetPassword();
    } else {
      show("warn", "This link isn't supported", "Open the Groceries app to manage your account.");
    }
  </script>
</body>
</html>
